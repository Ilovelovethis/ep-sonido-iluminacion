<!-- A brush-style check-mark: thin at the ends, thicker in the middle.
     The shape is drawn with a rounded stroke rather than a filled path,
     allowing the natural tapering of a brush stroke. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <path
    d="M5 12.5 L10 17 L19 7"
    fill="none"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
